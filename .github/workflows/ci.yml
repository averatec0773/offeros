name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default: nothing here publishes, comments, or pushes.
permissions:
  contents: read

# A rapid series of pushes should leave one running check, not five — but never
# cancel a run for a pull request someone is waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # The full suite finishes in minutes; anything past this is a hang, and an
    # unbounded job would sit there for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @offeros/extension
      - run: cd apps/web && npm run build
