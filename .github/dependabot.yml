# Dependency updates. This is a browser extension plus a local server that
# holds the user's résumé and API keys, so a compromised transitive package is
# a real path in — but a solo project drowns in daily one-package PRs and
# starts ignoring them, which is worse than not having this at all.
#
# Hence: weekly, and grouped so a week of updates is one pull request to read
# rather than fifteen. Security advisories are delivered separately by GitHub
# and are not affected by the schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # Patch and minor bumps are the bulk of the noise and almost never need
      # thought. Majors stay separate: they are the ones worth reading.
      #
      # Except below 1.0, where the minor position IS the breaking position —
      # semver says nothing is stable before 1.0 and projects there use minor
      # for breaking changes. The very first grouped pull request proved it: a
      # "minor" wxt 0.20 -> 0.21 removed an export the test config imports, and
      # took thirteen genuinely safe updates down with it. Anything still on
      # 0.x gets its own pull request so it can fail alone.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [wxt, esbuild, "@types/chrome"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
